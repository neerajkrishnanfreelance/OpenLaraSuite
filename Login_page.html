<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro - Login / Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    /* Defining the colors from the previous app structure for consistency */
    :root {
      --purple-600: #9333ea;
      --purple-700: #7c3aed;
      --purple-800: #6b21a8;
      --purple-900: #581c87;
      --yellow-400: #facc15;
    }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f9fafb; }
    
    /* Toggle State Management (Hidden Radio Buttons) */
    input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
    
    /* Show/Hide Forms based on selected tab */
    .form-content { display: none; }
    #login-tab:checked ~ .auth-wrapper #login-form,
    #signup-tab:checked ~ .auth-wrapper #signup-form {
      display: block;
    }
    
    /* Active tab style using direct selectors */
    .tab-label { cursor: pointer; transition: all 0.2s; }
    .tab-label-login, .tab-label-signup {
      @apply text-gray-500 hover:text-purple-600 font-medium border-b-4 border-transparent;
    }

    #login-tab:checked ~ .auth-wrapper #login-label {
      @apply text-purple-700 border-purple-700 font-bold;
    }
    #signup-tab:checked ~ .auth-wrapper #signup-label {
      @apply text-purple-700 border-purple-700 font-bold;
    }
    
    /* Input Focus Styling */
    .input-auth:focus {
      border-color: var(--purple-600);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gray-50">

  <!-- View State: Tabs -->
  <input type="radio" name="auth-view" id="login-tab" checked>
  <input type="radio" name="auth-view" id="signup-tab">

  <div class="auth-wrapper bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden transform transition duration-300 hover:shadow-3xl">
    
    <!-- Branding Header (Deep Purple Gradient) -->
    <div class="bg-gradient-to-r from-purple-800 to-purple-900 p-8 text-center">
      <i class="fas fa-tasks text-5xl text-yellow-400 mb-3 animate-pulse"></i>
      <h1 class="text-3xl font-extrabold tracking-tight text-white">
        TaskFlow Pro
      </h1>
      <p class="text-purple-200 mt-1">Access your projects and calendar.</p>
    </div>

    <!-- Content Area -->
    <div class="p-8 sm:p-10">
      <!-- Tabs for switching between Login and Sign Up -->
      <div class="flex border-b border-gray-200 mb-8">
        <label id="login-label" for="login-tab" class="tab-label tab-label-login flex-1 text-center pb-3 text-lg">
          Log In
        </label>
        <label id="signup-label" for="signup-tab" class="tab-label tab-label-signup flex-1 text-center pb-3 text-lg">
          Sign Up
        </label>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="form-content space-y-6">
        <div>
          <label for="login-email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
          <input type="email" id="login-email" placeholder="you@company.com" required 
                 class="input-auth w-full px-5 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-purple-100 transition duration-150">
        </div>
        <div>
          <label for="login-password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required 
                 class="input-auth w-full px-5 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-purple-100 transition duration-150">
          <a href="#" class="text-sm text-purple-600 hover:text-purple-700 font-medium block mt-2 text-right">Forgot Password?</a>
        </div>
        
        <button type="submit" 
                class="w-full bg-gradient-to-r from-purple-600 to-purple-700 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl cursor-pointer transition transform hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-purple-300">
          Sign In
        </button>
      </form>

      <!-- Sign Up Form -->
      <form id="signup-form" class="form-content space-y-6">
        <div>
          <label for="signup-name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
          <input type="text" id="signup-name" placeholder="John Doe" required 
                 class="input-auth w-full px-5 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-purple-100 transition duration-150">
        </div>
        <div>
          <label for="signup-email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
          <input type="email" id="signup-email" placeholder="you@company.com" required 
                 class="input-auth w-full px-5 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-purple-100 transition duration-150">
        </div>
        <div>
          <label for="signup-password" class="block text-sm font-medium text-gray-700 mb-2">Create Password</label>
          <input type="password" id="signup-password" placeholder="Minimum 8 characters" required 
                 class="input-auth w-full px-5 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-purple-100 transition duration-150">
        </div>
        
        <button type="submit" 
                class="w-full bg-gradient-to-r from-purple-600 to-purple-700 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl cursor-pointer transition transform hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-purple-300">
          Create Account
        </button>
      </form>
    </div>
  </div>

</body>
</html>
