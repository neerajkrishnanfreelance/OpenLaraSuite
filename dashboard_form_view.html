<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sarah Connor - My CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50 border-b">
    <div class="flex items-center justify-between p-4">
      <a href="crm-dashboard.html" class="text-indigo-600 font-bold flex items-center gap-2">
        <i class="fas fa-arrow-left"></i> Back
      </a>
      <h1 class="text-xl font-bold text-gray-800">Sarah Connor</h1>
      <div class="flex gap-3">
        <button class="px-5 py-2 border rounded-lg font-medium">Mark as Won</button>
        <button class="px-6 py-2 bg-indigo-600 text-white rounded-lg font-bold">Save</button>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto p-4 md:p-6">

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Left: Main Form -->
      <div class="lg:col-span-2 space-y-6">

        <!-- Lead Info Form (same as before) -->
        <div class="bg-white rounded-xl shadow p-6">
          <h2 class="text-lg font-bold text-gray-800 mb-6">Lead Information</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div><label class="block text-sm font-medium text-gray-700">Contact Name</label><input type="text" value="Sarah Connor" class="mt-1 block w-full px-4 py-3 border rounded-lg"></div>
            <div><label class="block text-sm font-medium text-gray-700">Project Name</label><input type="text" value="Corporate Website Redesign" class="mt-1 block w-full px-4 py-3 border rounded-lg"></div>
            <div><label class="block text-sm font-medium text-gray-700">Mobile</label><input type="tel" value="+1 555-0198" class="mt-1 block w-full px-4 py-3 border rounded-lg"></div>
            <div><label class="block text-sm font-medium text-gray-700">Expected Revenue</label><input type="number" value="8000" class="mt-1 block w-full px-4 py-3 border rounded-lg"></div>
            <div><label class="block text-sm font-medium text-gray-700">Stage</label>
              <select class="mt-1 block w-full px-4 py-3 border rounded-lg">
                <option>New</option>
                <option selected>Qualified</option>
                <option>Proposal</option>
                <option>Won</option>
              </select>
            </div>
            <div><label class="block text-sm font-medium text-gray-700">Source</label>
              <select class="mt-1 block w-full px-4 py-3 border rounded-lg">
                <option>LinkedIn</option>
                <option>Website</option>
                <option>Referral</option>
              </select>
            </div>
          </div>
          <div class="mt-6">
            <label class="block text-sm font-medium text-gray-700">Description</label>
            <textarea rows="4" class="mt-1 block w-full px-4 py-3 border rounded-lg">Client wants a modern, fast, SEO-optimized website with CMS integration...</textarea>
          </div>
        </div>

        <!-- SCHEDULED ACTIVITIES -->
        <div class="bg-white rounded-xl shadow p-6">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
              <i class="fas fa-clock text-indigo-600"></i> Scheduled Activities
            </h3>
            <button class="text-indigo-600 font-medium flex items-center gap-1 text-sm hover:underline">
              <i class="fas fa-plus-circle"></i> Schedule Activity
            </button>
          </div>
          <div class="space-y-3">
            <div class="flex items-center justify-between p-3 bg-green-50 rounded-lg border border-green-200">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center text-white font-bold">C</div>
                <div>
                  <div class="font-medium">Call Sarah</div>
                  <div class="text-sm text-gray-600">Today, 3:00 PM → 3:30 PM</div>
                </div>
              </div>
              <button class="text-green-600"><i class="fas fa-check-circle"></i></button>
            </div>
            <div class="flex items-center justify-between p-3 bg-yellow-50 rounded-lg border border-yellow-200">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-yellow-500 rounded-full flex items-center justify-center text-white font-bold">E</div>
                <div>
                  <div class="font-medium">Send Proposal</div>
                  <div class="text-sm text-gray-600">Tomorrow, 10:00 AM</div>
                </div>
              </div>
              <button class="text-gray-400 hover:text-red-600"><i class="fas fa-times"></i></button>
            </div>
          </div>
        </div>

      </div>

      <!-- Right Sidebar: Chatter -->
      <div class="lg:col-span-1">
        <div class="bg-white rounded-xl shadow sticky top-24">
          <div class="p-4 border-b">
            <h3 class="font-bold text-gray-800 flex items-center gap-2">
              <i class="fas fa-comments text-indigo-600"></i> Chatter (8)
            </h3>
          </div>

          <!-- Message Feed -->
          <div class="max-h-96 overflow-y-auto p-4 space-y-4">
            <div class="flex gap-3">
              <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold">Y</div>
              <div class="flex-1">
                <div class="bg-gray-100 rounded-lg p-3">
                  <p class="text-sm">Sent initial proposal. Waiting for feedback.</p>
                  <p class="text-xs text-gray-500 mt-1">You • 2 hours ago</p>
                </div>
              </div>
            </div>
            <div class="flex gap-3">
              <div class="w-10 h-10 bg-gray-400 rounded-full flex items-center justify-center text-white font-bold">S</div>
              <div class="flex-1">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
                  <p class="text-sm">Looks good! Can we schedule a call next week?</p>
                  <p class="text-xs text-gray-500 mt-1">Sarah Connor • 1 day ago</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Send Message -->
          <div class="p-4 border-t">
            <textarea rows="3" placeholder="Write a message or @mention someone..." class="w-full px-4 py-3 border rounded-lg text-sm resize-none focus:ring-2 focus:ring-indigo-500"></textarea>
            <div class="flex justify-between items-center mt-3">
              <div class="flex gap-3 text-gray-500">
                <button><i class="fas fa-paperclip"></i></button>
                <button><i class="fas fa-smile"></i></button>
              </div>
              <button class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-indigo-700">Send</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
