<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-6 text-center shadow-md">
    <h1 class="text-2xl font-bold">My Personal Hub</h1>
    <p class="text-sm opacity-80">All tools in one place</p>
  </header>

  <!-- Sections -->
  <main class="p-4">
    
    <!-- Grid of Features -->
    <div class="grid grid-cols-2 gap-4">

      <!-- Card Component -->
      <a class="bg-white shadow rounded-xl p-4 flex flex-col items-center text-center hover:bg-indigo-50 transition">
        <span class="text-lg font-semibold mb-2">CRM</span>
      </a>

      <a class="bg-white shadow rounded-xl p-4 flex flex-col items-center text-center hover:bg-indigo-50 transition">
        <span class="text-lg font-semibold mb-2">Project</span>
      </a>

      <a class="bg-white shadow rounded-xl p-4 flex flex-col items-center text-center hover:bg-indigo-50 transition">
        <span class="text-lg font-semibold mb-2">Accounting</span>
      </a>

      <a class="bg-white shadow rounded-xl p-4 flex flex-col items-center text-center hover:bg-indigo-50 transition">
        <span class="text-lg font-semibold mb-2">Learning</span>
      </a>

      <a class="bg-white shadow rounded-xl p-4 flex flex-col items-center text-center hover:bg-indigo-50 transition">
        <span class="text-lg font-semibold mb-2">Budget</span>
      </a>

      <a class="bg-white shadow rounded-xl p-4 flex flex-col items-center text-center hover:bg-indigo-50 transition">
        <span class="text-lg font-semibold mb-2">Health</span>
      </a>

      <a class="bg-white shadow rounded-xl p-4 flex flex-col items-center text-center hover:bg-indigo-50 transition">
        <span class="text-lg font-semibold mb-2">Expense</span>
      </a>

      <a class="bg-white shadow rounded-xl p-4 flex flex-col items-center text-center hover:bg-indigo-50 transition">
        <span class="text-lg font-semibold mb-2">Learning 2</span>
      </a>

      <a class="bg-white shadow rounded-xl p-4 flex flex-col items-center text-center hover:bg-indigo-50 transition">
        <span class="text-lg font-semibold mb-2">Calendar</span>
      </a>

      <a class="bg-white shadow rounded-xl p-4 flex flex-col items-center text-center hover:bg-indigo-50 transition">
        <span class="text-lg font-semibold mb-2">Todo</span>
      </a>

      <a class="bg-white shadow rounded-xl p-4 flex flex-col items-center text-center hover:bg-indigo-50 transition">
        <span class="text-lg font-semibold mb-2">Journaling</span>
      </a>

    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center text-gray-600 text-sm py-4">
    © 2025 Personal Hub. All Rights Reserved.
  </footer>

</body>
</html>
